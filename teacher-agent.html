<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="description" content="وكيل المعلم في المختبر الافتراضي للعلوم VLab: يتابع إتقان الطالب لكل موضوع ويختار السؤال والتجربة التالية، ويجهز للمعلم خطة حصة علاجية واختباراً قصيراً وتقريراً. تصميم الأستاذ يوسف القاق.">
<link rel="canonical" href="https://www.vlabjo.com/teacher-agent.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>وكيل المعلم VLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;
  /* layout: slim header, role tabs, one working column beside a sticky OODA decision log */
  --bg:#f3f6f2; --surface:#ffffff; --ink:#12302b; --muted:#587069; --line:#d6e0da;
  --accent:#0e7c70; --accent-ink:#ffffff; --accent-bg:#dff1ee;
  --good:#1b7a3e; --good-bg:#e1f3e7; --warn:#8a5206; --warn-bg:#fbefd5; --bad:#b3261e; --bad-bg:#fbe3e0;
  --display:'Cairo',system-ui,sans-serif; --body:'Tajawal','Cairo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-size:1.25rem;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:700}
.ghost:hover{border-color:var(--accent)}
.tabs{display:flex;gap:6px;padding:12px 20px 0;max-width:1180px;margin:0 auto}
.tab{background:transparent;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 18px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:inset 0 3px 0 var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:0 20px 28px;max-width:1180px;margin:0 auto;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0 0 12px 12px;padding:20px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
h2{font-size:1.1rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
label{font-weight:700}
select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:84px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 18px;font-weight:800}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.alt{background:var(--accent-bg);color:var(--ink);border:1px solid var(--line)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
.band-low>i{background:var(--bad)} .band-mid>i{background:var(--warn)} .band-high>i{background:var(--good)}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:end}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700;border:1px solid var(--line)}
.chip.low{background:var(--bad-bg);color:var(--bad)} .chip.mid{background:var(--warn-bg);color:var(--warn)} .chip.high{background:var(--good-bg);color:var(--good)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--accent-bg)}
.plan{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.plan .card{padding:12px}
.heat{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:start;font-weight:700;white-space:nowrap}
thead th{background:var(--bg);font-family:var(--display);font-size:.85rem}
td.low{background:var(--bad-bg);color:var(--bad)} td.mid{background:var(--warn-bg);color:var(--warn)} td.high{background:var(--good-bg);color:var(--good)}
td{font-variant-numeric:tabular-nums;font-weight:700}
tfoot td{background:var(--bg)}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
pre.out{white-space:pre-wrap;word-break:break-word;margin:0;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--body);font-size:.95rem;max-height:420px;overflow:auto}
.log{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px}
.log ol{list-style:none;margin:0;padding:0;overflow:auto;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:.88rem;align-items:start}
.ph{border-radius:6px;padding:0 6px;text-align:center;font-weight:800;font-size:.76rem;border:1px solid var(--line)}
.ph-O{background:var(--accent-bg)} .ph-R{background:var(--warn-bg);color:var(--warn)} .ph-D{background:var(--bad-bg);color:var(--bad)} .ph-A{background:var(--good-bg);color:var(--good)}
.loop{display:flex;gap:6px;flex-wrap:wrap}
footer{max-width:1180px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:.88rem}
footer a{color:var(--accent);font-weight:700}
[hidden]{display:none!important}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .log{position:static;max-height:none}
  .bar-row{grid-template-columns:96px 1fr 44px}
}
@media (max-width:480px){
  .top,.tabs,.layout,footer{padding-inline:16px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="OODA">
      <circle cx="22" cy="22" r="18" fill="none" stroke="var(--line)" stroke-width="5"/>
      <path d="M22 4 A18 18 0 0 1 40 22" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
      <path d="M40 22 A18 18 0 0 1 22 40" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
      <path d="M22 40 A18 18 0 0 1 4 22" fill="none" stroke="var(--bad)" stroke-width="5" stroke-linecap="round"/>
      <path d="M4 22 A18 18 0 0 1 22 4" fill="none" stroke="var(--good)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div><h1 data-i18n="title"></h1><p data-i18n="sub"></p></div>
  </div>
  <div class="row"><a class="ghost" href="/" style="text-decoration:none;color:var(--ink)">← المختبر</a><button id="langBtn" class="ghost" type="button"></button></div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-student" aria-selected="true" aria-controls="view-student" data-i18n="tabStudent"></button>
  <button class="tab" role="tab" id="tab-teacher" aria-selected="false" aria-controls="view-teacher" data-i18n="tabTeacher"></button>
</div>

<div class="layout">
  <main>
    <section class="panel stack" id="view-student" role="tabpanel" aria-labelledby="tab-student">
      <div class="row">
        <label for="profile" data-i18n="chooseStudent"></label>
        <select id="profile"></select>
        <button class="btn alt" id="restart" type="button" data-i18n="restart"></button>
      </div>
      <p class="muted small" data-i18n="studentIntro"></p>
      <div class="card">
        <h2 data-i18n="mastery"></h2>
        <div class="bars" id="bars" style="margin-top:12px"></div>
      </div>
      <div class="card" id="qcard"></div>
      <div class="card">
        <h2 data-i18n="planTitle"></h2>
        <p class="muted small" data-i18n="planNote"></p>
        <div class="plan" id="plan"></div>
      </div>
    </section>

    <section class="panel stack" id="view-teacher" role="tabpanel" aria-labelledby="tab-teacher" hidden>
      <p class="muted small" data-i18n="teacherIntro"></p>
      <div class="row">
        <button class="btn" id="runAgent" type="button" data-i18n="runAgent"></button>
        <span class="muted small" data-i18n="demoData"></span>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="card">
        <h2 data-i18n="heatTitle"></h2>
        <div class="heat" style="margin-top:12px"><table id="heat"></table></div>
      </div>
      <div class="card stack" id="insights"></div>
      <div class="card stack">
        <h2 data-i18n="actions"></h2>
        <div class="row">
          <button class="btn alt" id="mkPlan" type="button" data-i18n="mkPlan"></button>
          <button class="btn alt" id="mkTest" type="button" data-i18n="mkTest"></button>
          <button class="btn alt" id="mkReport" type="button" data-i18n="mkReport"></button>
        </div>
        <div id="outWrap" hidden class="stack">
          <div class="row"><h3 id="outTitle"></h3><button class="ghost" id="copyBtn" type="button" data-i18n="copy"></button><span id="copyMsg" class="small muted" role="status"></span></div>
          <pre class="out" id="out" tabindex="0"></pre>
        </div>
      </div>
      <div class="card stack" id="askBox" hidden>
        <h2 data-i18n="askTitle"></h2>
        <p class="muted small" data-i18n="askNote"></p>
        <label for="askIn" class="small" data-i18n="askLabel"></label>
        <textarea id="askIn"></textarea>
        <div class="row"><button class="btn" id="askBtn" type="button" data-i18n="askBtn"></button><span id="askMsg" class="small muted" role="status"></span></div>
        <pre class="out" id="askOut" hidden tabindex="0"></pre>
      </div>
    </section>
  </main>

  <aside class="log" aria-labelledby="logTitle">
    <h2 id="logTitle" data-i18n="logTitle"></h2>
    <div class="loop small muted" data-i18n="loopLegend"></div>
    <ol id="logList" aria-live="polite"></ol>
  </aside>
</div>
<footer><span data-i18n="foot"></span> <a href="https://www.vlabjo.com" target="_blank" rel="noopener">www.vlabjo.com</a></footer>

const NAMES = [['ليث','Layth'],['سارة','Sara'],['عمر','Omar'],['لين','Leen'],['يزن','Yazan'],['ريم','Reem'],['حمزة','Hamzah'],['جود','Joud'],['طارق','Tareq'],['مها','Maha'],['آدم','Adam'],['دانة','Dana']];
const PROFILES = {
  layth:{n:NAMES[0], m:{acids:.35,atom:.60,forces:.55,density:.30,cell:.65}},
  sara: {n:NAMES[1], m:{acids:.80,atom:.85,forces:.70,density:.75,cell:.90}},
  fresh:{n:['طالب جديد','New student'], m:{acids:.5,atom:.5,forces:.5,density:.5,cell:.5}}
};

/* ---------- state ---------- */
let lang = 'ar';
const st = { profile:'layth', m:{}, asked:new Set(), cur:null, answered:false, picked:-1, n:0, ok:0 };
const log = [];
let outKind = null;
const $ = id => document.getElementById(id);
const s = k => S[k][lang];
const tx = o => o[lang];
const pct = v => Math.round(v*100);
const band = v => v < .45 ? 'low' : v < .7 ? 'mid' : 'high';
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const topicById = id => TOPICS.find(t => t.id === id);

/* class data: deterministic */
function hash(i,j){ let x = Math.sin(i*127.1 + j*311.7)*43758.5453; return x - Math.floor(x); }
const CLASS = NAMES.map((n,i) => {
  const m = {};
  TOPICS.forEach((t,j) => {
    if (i === 0) m[t.id] = PROFILES.layth.m[t.id];
    else if (i === 1) m[t.id] = PROFILES.sara.m[t.id];
    else m[t.id] = clamp(t.base + (hash(i,j)-.5)*.5, .08, .96);
  });
  return {n, m};
});
const sAvg = stu => TOPICS.reduce((a,t) => a + stu.m[t.id], 0) / TOPICS.length;
const tAvg = id => CLASS.reduce((a,c) => a + c.m[id], 0) / CLASS.length;
const stuName = c => c.n[lang === 'ar' ? 0 : 1];

/* ---------- log ---------- */
function say(ph, ar, en){
  log.unshift({ph, ar, en});
  if (log.length > 60) log.pop();
  renderLog();
}
function renderLog(){
  const names = {O:s('phO'),R:s('phR'),D:s('phD'),A:s('phA')};
  $('logList').innerHTML = log.map(e =>
    `<li><span class="ph ph-${e.ph}">${names[e.ph]}</span><span>${e[lang]}</span></li>`).join('');
}

/* ---------- student ---------- */
function resetStudent(){
  const p = PROFILES[st.profile];
  st.m = Object.assign({}, p.m);
  st.asked = new Set(); st.cur = null; st.answered = false; st.picked = -1; st.n = 0; st.ok = 0;
  say('O',
    `قرأ الوكيل ملف الطالب «${p.n[0]}» ووجد ${TOPICS.length} مواضيع بمستويات إتقان مختلفة.`,
    `The agent read the profile of "${p.n[1]}": ${TOPICS.length} topics at different mastery levels.`);
  pickNext();
  renderStudent();
}
function targetLevel(m){ return m < .4 ? 1 : m < .7 ? 2 : 3; }
function pickNext(){
  const order = TOPICS.slice().sort((a,b) => st.m[a.id] - st.m[b.id]);
  for (const t of order){
    const lvl = targetLevel(st.m[t.id]);
    const pool = QB.filter(q => q.t === t.id && !st.asked.has(q.id))
                   .sort((a,b) => Math.abs(a.l-lvl) - Math.abs(b.l-lvl));
    if (pool.length){
      st.cur = pool[0]; st.answered = false; st.picked = -1;
      say('D',
        `القرار: سؤال من «${t.name.ar}» بالمستوى ${pool[0].l} لأنه الأضعف حاليًا (${pct(st.m[t.id])}٪).`,
        `Decision: a question on "${t.name.en}" at level ${pool[0].l}, the weakest topic now (${pct(st.m[t.id])}%).`);
      say('A', 'عرض السؤال على الطالب.', 'Question shown to the student.');
      return;
    }
  }
  st.cur = null;
}
function answer(i){
  if (st.answered || !st.cur) return;
  const q = st.cur, t = topicById(q.t), before = st.m[q.t];
  const ok = i === q.a;
  st.answered = true; st.picked = i; st.n++; if (ok) st.ok++;
  st.m[q.t] = ok ? clamp(before + (1-before)*(.25 + .05*q.l), 0, .99)
                 : clamp(before - .18 + (q.l-1)*.03, .05, 1);
  st.asked.add(q.id);
  say('O', `أجاب الطالب عن سؤال «${t.name.ar}» (مستوى ${q.l}): ${ok ? 'صحيح' : 'خطأ'}.`,
           `The student answered a "${t.name.en}" question (level ${q.l}): ${ok ? 'correct' : 'wrong'}.`);
  say('R', `تحديث الإتقان في «${t.name.ar}»: ${pct(before)}٪ ← ${pct(st.m[q.t])}٪.`,
           `Mastery in "${t.name.en}" updated: ${pct(before)}% → ${pct(st.m[q.t])}%.`);
  say('A', 'أعاد الوكيل بناء خطة الطالب.', 'The agent rebuilt the student plan.');
  renderStudent();
}
function renderStudent(){
  $('bars').innerHTML = TOPICS.map(t => {
    const v = st.m[t.id];
    return `<div class="bar-row"><span>${tx(t.name)}</span><div class="bar band-${band(v)}"><i style="width:${pct(v)}%"></i></div><span class="num">${pct(v)}%</span></div>`;
  }).join('');

  const qc = $('qcard');
  if (!st.cur){
    qc.innerHTML = `<p>${s('done')}</p>`;
  } else {
    const q = st.cur, t = topicById(q.t);
    let h = `<div class="row"><h2>${s('question')} ${st.n + (st.answered ? 0 : 1)}</h2><span class="chip">${tx(t.name)}</span><span class="chip">${s('level')} ${q.l}</span><span class="muted small">${s('score')}: ${st.ok}/${st.n}</span></div>`;
    h += `<p style="font-size:1.1rem;font-weight:700;margin:10px 0 0">${tx(q.q)}</p><div class="opts">`;
    tx(q.o).forEach((o,i) => {
      let cls = 'opt';
      if (st.answered){ if (i === q.a) cls += ' right'; else if (i === st.picked) cls += ' wrong'; }
      h += `<button class="${cls}" type="button" data-i="${i}" ${st.answered ? 'disabled' : ''}>${o}</button>`;
    });
    h += '</div>';
    if (st.answered){
      const ok = st.picked === q.a;
      h += `<div class="fb"><b>${ok ? s('right') : s('wrong')}</b> ${tx(q.e)}</div>`;
      h += `<div style="margin-top:12px"><button class="btn" id="nextBtn" type="button">${s('next')}</button></div>`;
    }
    qc.innerHTML = h;
    qc.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
    const nb = $('nextBtn');
    if (nb) nb.onclick = () => { pickNext(); renderStudent(); };
  }

  const order = TOPICS.slice().sort((a,b) => st.m[a.id] - st.m[b.id]);
  const weak = order.slice(0,2), strong = order[order.length-1];
  let ph = weak.map((t,i) => {
    const v = st.m[t.id], mins = Math.round(10 + clamp(.8 - v, 0, .8)*30);
    return `<div class="card"><span class="chip ${band(v)}">${i === 0 ? s('whyWeak') : s('whyNext')} · ${pct(v)}%</span>
      <h3 style="margin-top:8px">${tx(t.name)}</h3>
      <p class="small" style="margin:6px 0 0"><b>${s('experiment')}:</b> ${tx(t.exp)}<br><b>${mins}</b> ${s('minutes')}</p></div>`;
  }).join('');
  if (st.m[strong.id] >= .8){
    ph += `<div class="card"><span class="chip high">${s('challenge')} · ${pct(st.m[strong.id])}%</span>
      <h3 style="margin-top:8px">${tx(strong.name)}</h3><p class="small" style="margin:6px 0 0">${s('challengeTxt')}</p></div>`;
  }
  $('plan').innerHTML = ph;
}

/* ---------- teacher ---------- */
function teacherModel(){
  const avgs = TOPICS.map(t => ({t, v:tAvg(t.id)})).sort((a,b) => a.v - b.v);
  const weakest = avgs[0];
  const risk = CLASS.filter(c => c.m[weakest.t.id] < .45);
  const strong = CLASS.filter(c => c.m[weakest.t.id] >= .75);
  const overall = CLASS.reduce((a,c) => a + sAvg(c), 0) / CLASS.length;
  return {avgs, weakest, risk, strong, overall};
}
function renderTeacher(){
  const M = teacherModel();
  $('kpis').innerHTML = [
    [s('kClass'), pct(M.overall)+'%'],
    [s('kWeak'), tx(M.weakest.t.name) + ' · ' + pct(M.weakest.v) + '%'],
    [s('kRisk'), M.risk.length + ' / ' + CLASS.length],
    [s('kStrong'), M.strong.length + ' / ' + CLASS.length]
  ].map(k => `<div class="kpi"><span class="muted small">${k[0]}</span><b style="${k[1].length>9?'font-size:1.05rem':''}">${k[1]}</b></div>`).join('');

  let h = `<thead><tr><th>${s('student')}</th>${TOPICS.map(t => `<th>${tx(t.name)}</th>`).join('')}</tr></thead><tbody>`;
  CLASS.forEach(c => {
    h += `<tr><td>${stuName(c)}</td>${TOPICS.map(t => `<td class="${band(c.m[t.id])}">${pct(c.m[t.id])}</td>`).join('')}</tr>`;
  });
  h += `</tbody><tfoot><tr><td>${s('avg')}</td>${TOPICS.map(t => `<td>${pct(tAvg(t.id))}</td>`).join('')}</tr></tfoot>`;
  $('heat').innerHTML = h;

  const list = a => a.length ? a.map(stuName).join(lang === 'ar' ? '، ' : ', ') : s('none');
  $('insights').innerHTML = `<h2>${s('insights')}</h2>
    <p style="margin:0">${lang === 'ar'
      ? `أضعف موضوع في الصف هو <b>${tx(M.weakest.t.name)}</b> بمتوسط ${pct(M.weakest.v)}٪. قرر الوكيل حصة علاجية عليه.`
      : `The weakest topic is <b>${tx(M.weakest.t.name)}</b> with a ${pct(M.weakest.v)}% average. The agent decided on a remedial session for it.`}</p>
    <p style="margin:0"><span class="chip low">${s('supportGrp')}</span> ${list(M.risk)}</p>
    <p style="margin:0"><span class="chip high">${s('enrichGrp')}</span> ${list(M.strong)}</p>`;
}
function runTeacher(){
  const M = teacherModel();
  say('O', `قرأ الوكيل ${CLASS.length} طالبًا × ${TOPICS.length} مواضيع = ${CLASS.length*TOPICS.length} سجل إتقان.`,
           `The agent read ${CLASS.length} students × ${TOPICS.length} topics = ${CLASS.length*TOPICS.length} mastery records.`);
  say('R', `أقل متوسط في «${M.weakest.t.name.ar}» (${pct(M.weakest.v)}٪)، وعدد الطلاب تحت 45٪ فيه: ${M.risk.length}.`,
           `Lowest average is "${M.weakest.t.name.en}" (${pct(M.weakest.v)}%); students below 45% there: ${M.risk.length}.`);
  say('D', `القرار: حصة علاجية على «${M.weakest.t.name.ar}» مع مجموعتي دعم وإثراء.`,
           `Decision: a remedial session on "${M.weakest.t.name.en}" with a support and an enrichment group.`);
  say('A', 'جهز الوكيل خطة الحصة والاختبار والتقرير. اضغط الزر المناسب لعرضها.',
           'The agent prepared the lesson plan, test and report. Press a button to view them.');
  renderTeacher();
}
function qLine(q, i){
  const L = 'ABCD';
  return (i === '' ? '' : `${i}) `) + `${tx(q.q)}\n` + tx(q.o).map((o,k) => `   ${L[k]}. ${o}`).join('\n');
}
function buildPlan(){
  const M = teacherModel(), t = M.weakest.t;
  const hook = QB.find(q => q.t === t.id && q.l === 1);
  const exit = QB.filter(q => q.t === t.id && q.l > 1);
  const list = a => a.length ? a.map(stuName).join(lang === 'ar' ? '، ' : ', ') : s('none');
  if (lang === 'ar') return `خطة حصة علاجية: ${t.name.ar}
المدة: 45 دقيقة
الهدف: رفع إتقان الصف من ${pct(M.weakest.v)}٪ إلى 70٪ على الأقل.

1) تمهيد (5 د): اطرح على الصف السؤال التالي دون إعطاء الجواب.
${qLine(hook,'')}

2) التجربة الافتراضية (15 د): «${t.exp.ar}» في مختبر VLab (www.vlabjo.com). يعمل الطلاب في أزواج ويسجلون ما يلاحظون.

3) نقاش موجه (10 د): يشرح كل زوج ما تغير في التجربة ولماذا. يصحح المعلم المفاهيم الخاطئة.

4) مجموعات (10 د):
   مجموعة الدعم: ${list(M.risk)}. تعيد التجربة مع بطاقات إرشاد.
   مجموعة الإثراء: ${list(M.strong)}. تصمم تجربة بمتغير جديد.

5) تذكرة خروج (5 د): سؤالان قصيران.
${exit.map((q,i) => qLine(q, i+1)).join('\n')}

مفتاح الإجابات: ${exit.map((q,i) => (i+1)+'-'+'ABCD'[q.a]).join('  ')}`;
  return `Remedial lesson plan: ${t.name.en}
Length: 45 minutes
Goal: lift class mastery from ${pct(M.weakest.v)}% to at least 70%.

1) Hook (5 min): ask the class this question without giving the answer.
${qLine(hook,'')}

2) Virtual experiment (15 min): "${t.exp.en}" in the VLab lab (www.vlabjo.com). Students work in pairs and record what they see.

3) Guided discussion (10 min): each pair explains what changed in the experiment and why. The teacher corrects misconceptions.

4) Groups (10 min):
   Support group: ${list(M.risk)}. Repeats the experiment with guide cards.
   Enrichment group: ${list(M.strong)}. Designs an experiment with a new variable.

5) Exit ticket (5 min): two short questions.
${exit.map((q,i) => qLine(q, i+1)).join('\n')}

Answer key: ${exit.map((q,i) => (i+1)+'-'+'ABCD'[q.a]).join('  ')}`;
}
function buildTest(){
  const M = teacherModel();
  const ts = M.avgs.slice(0,2).map(a => a.t);
  const qs = []; ts.forEach(t => QB.filter(q => q.t === t.id).sort((a,b) => a.l-b.l).forEach(q => qs.push(q)));
  const head = lang === 'ar'
    ? `اختبار قصير: ${ts.map(t => t.name.ar).join(' + ')}\nالأسئلة: ${qs.length}، الزمن: 12 دقيقة. الأسئلة مرتبة من السهل إلى الصعب في كل موضوع.\n\n`
    : `Short test: ${ts.map(t => t.name.en).join(' + ')}\nQuestions: ${qs.length}, time: 12 minutes. Questions run from easy to hard within each topic.\n\n`;
  const key = (lang === 'ar' ? '\n\nمفتاح الإجابات: ' : '\n\nAnswer key: ') + qs.map((q,i) => (i+1)+'-'+'ABCD'[q.a]).join('  ');
  return head + qs.map((q,i) => qLine(q, i+1)).join('\n\n') + key;
}
function buildReport(){
  const M = teacherModel();
  const list = a => a.length ? a.map(stuName).join(lang === 'ar' ? '، ' : ', ') : s('none');
  const rows = M.avgs.map(a => `- ${tx(a.t.name)}: ${pct(a.v)}%`).join('\n');
  if (lang === 'ar') return `تقرير أداء الصف في العلوم
عدد الطلاب: ${CLASS.length}
متوسط الصف العام: ${pct(M.overall)}٪

الإتقان حسب الموضوع (من الأضعف):
${rows}

الموضوع الأولى بالمعالجة: ${tx(M.weakest.t.name)} (${pct(M.weakest.v)}٪).
طلاب يحتاجون دعمًا فيه: ${list(M.risk)}.
طلاب جاهزون للإثراء: ${list(M.strong)}.

الإجراء المقرر: حصة علاجية من 45 دقيقة تعتمد على التجربة الافتراضية «${M.weakest.t.exp.ar}»، ثم اختبار قصير لقياس التحسن.
ملاحظة: البيانات في هذا التقرير تجريبية لأغراض العرض.`;
  return `Class science performance report
Students: ${CLASS.length}
Overall class average: ${pct(M.overall)}%

Mastery by topic (weakest first):
${rows}

Topic that needs attention first: ${tx(M.weakest.t.name)} (${pct(M.weakest.v)}%).
Students needing support there: ${list(M.risk)}.
Students ready for enrichment: ${list(M.strong)}.

Decided action: a 45-minute remedial session built on the virtual experiment "${M.weakest.t.exp.en}", then a short test to measure improvement.
Note: the data in this report is demo data for presentation.`;
}
function showOut(kind){
  outKind = kind;
  const f = {plan:buildPlan, test:buildTest, report:buildReport}[kind];
  const ttl = {plan:'mkPlan', test:'mkTest', report:'mkReport'}[kind];
  $('outWrap').hidden = false;
  $('outTitle').textContent = s(ttl);
  $('out').textContent = f();
  $('copyMsg').textContent = '';
  const M = teacherModel();
  say('A', `أنشأ الوكيل «${S[ttl].ar}» حول «${M.weakest.t.name.ar}».`, `The agent created "${S[ttl].en}" on "${M.weakest.t.name.en}".`);
}

  const text = $('out').textContent;
  try { await navigator.clipboard.writeText(text); $('copyMsg').textContent = s('copied'); }

  }
}

/* ---------- ask the agent (Claude with page tools) ---------- */
let sampleFn = null;
if (window.claude && typeof claude.use === 'function'){
  claude.use('sample').then(f => { if (f){ sampleFn = f; $('askBox').hidden = false; } }).catch(() => {});
}
async function ask(){
  if (!sampleFn) return;
  const M = teacherModel();
  const req = $('askIn').value.trim() || s('askDefault');
  const out = $('askOut'); out.hidden = false; out.textContent = s('askWorking');
  $('askBtn').disabled = true; $('askMsg').textContent = '';
  say('O', 'استلم الوكيل طلبًا حرًا من المعلم.', 'The agent received a free-form request from the teacher.');
  const tools = [
    {name:'get_class_summary', description:'Class mastery per topic (0-100), weakest topic, students below 45 percent in the weakest topic, and enrichment candidates.',
     execute: () => ({
       topics: M.avgs.map(a => ({id:a.t.id, name:a.t.name.en, averagePercent:pct(a.v), experiment:a.t.exp.en})),
       weakestTopic: M.weakest.t.id,
       supportStudents: M.risk.map(c => c.n[1]),
       enrichmentStudents: M.strong.map(c => c.n[1])
     })},
    {name:'get_questions', description:'Question bank items for one topic id and an optional level 1-3.',
     inputSchema:{type:'object',properties:{topic:{type:'string',enum:TOPICS.map(t => t.id)},level:{type:'integer',minimum:1,maximum:3}},required:['topic']},
     execute: inp => QB.filter(q => q.t === inp.topic && (!inp.level || q.l === inp.level))
                       .map(q => ({level:q.l, question:q.q.en, options:q.o.en, answerIndex:q.a}))}
  ];
  const prompt = `You are the Teacher Agent inside VLab, a virtual science lab for Jordanian school students. A teacher asks you for help. Use the tools to read the class data and question bank before answering. Be concrete and short. Write the answer in ${lang === 'ar' ? 'Arabic' : 'English'}. Use only the data the tools return; the class data is demo data.\n\nTeacher request: ${req}`;
  try {
    await sampleFn(prompt, {tools, cache:false, onText:({text}) => { out.textContent = text; }});
    say('A', 'كتب الوكيل الرد بعد قراءة بيانات الصف وبنك الأسئلة.', 'The agent wrote the reply after reading the class data and question bank.');
  } catch (e) {
    if (e && e.text) out.textContent = e.text; else out.textContent = s('askErr');
  } finally { $('askBtn').disabled = false; }
}

/* ---------- chrome ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'وكيل المعلم VLab' : 'VLab Teacher Agent';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = s(el.dataset.i18n); });
  $('langBtn').textContent = s('langBtn');
  $('profile').innerHTML = Object.entries(PROFILES).map(([k,p]) =>
    `<option value="${k}" ${k === st.profile ? 'selected' : ''}>${p.n[lang === 'ar' ? 0 : 1]}</option>`).join('');
  if (!$('askIn').dataset.touched) $('askIn').value = s('askDefault');
  renderStudent(); renderTeacher(); renderLog();
  if (outKind) showOutQuiet();
}
function showOutQuiet(){
  const f = {plan:buildPlan, test:buildTest, report:buildReport}[outKind];
  const ttl = {plan:'mkPlan', test:'mkTest', report:'mkReport'}[outKind];
  $('outTitle').textContent = s(ttl); $('out').textContent = f();
}
function showTab(which){
  const stu = which === 'student';
  $('view-student').hidden = !stu; $('view-teacher').hidden = stu;
  $('tab-student').setAttribute('aria-selected', stu); $('tab-teacher').setAttribute('aria-selected', !stu);
}
$('tab-student').onclick = () => showTab('student');
$('tab-teacher').onclick = () => showTab('teacher');
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; applyLang(); };
$('profile').onchange = e => { st.profile = e.target.value; resetStudent(); };
$('restart').onclick = resetStudent;
$('runAgent').onclick = runTeacher;
$('mkPlan').onclick = () => showOut('plan');
$('mkTest').onclick = () => showOut('test');
$('mkReport').onclick = () => showOut('report');
$('copyBtn').onclick = copyOut;
$('askBtn').onclick = ask;
$('askIn').addEventListener('input', () => { $('askIn').dataset.touched = '1'; });

applyLang();
resetStudent();
runTeacher();
</script>
</body>
</html>
